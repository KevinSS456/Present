<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa história</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#06231c;--bg2:#0c3b2e;--ink:#eafff5;--accent:#6ee7a8;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;overflow-x:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,var(--bg2),var(--bg));z-index:0}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:30}
#track{position:relative;z-index:2}

.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:2.4svh;padding:22svh 7vw 0;opacity:0;pointer-events:none;will-change:opacity,transform;text-shadow:0 2px 20px var(--bg)}
.arch{position:relative;margin:0;width:min(60vw,28svh);aspect-ratio:3/4;border-radius:999px 999px 14px 14px;will-change:transform}
.arch img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;background:var(--bg2);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.arch>img{position:absolute;inset:0}
.arch::after{content:"";position:absolute;inset:-9px;border:1px solid var(--accent);opacity:.65;border-radius:999px 999px 22px 22px}
.arch figcaption{position:absolute;left:50%;bottom:-2.1rem;translate:-50% 0;white-space:nowrap;font-family:"Caveat",cursive;font-size:1.3rem;color:var(--accent)}
.words{max-width:33rem;text-align:center;padding-top:1.6rem}
.scene:not(.hero) .words{background:color-mix(in srgb,var(--bg) 74%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:18px;padding:.8rem 1rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (min-width:860px){.scene:not(.hero) .words{padding:1.2rem 1.5rem}}
.date{margin:0 0 .35rem;font-family:"Caveat",cursive;font-size:1.4rem;color:var(--accent)}
h2{margin:0 0 .55rem;font-weight:600;font-size:clamp(1.6rem,6vw,2.9rem);line-height:1.1;letter-spacing:-.01em;font-variation-settings:"opsz" 144}
.tx p{margin:0;font-size:clamp(.98rem,3.3vw,1.2rem);line-height:1.55;opacity:.93;will-change:transform}
.tx{overflow:hidden}
.tx.pan{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 .7rem,#000 calc(100% - 1.4rem),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 .7rem,#000 calc(100% - 1.4rem),transparent 100%)}
.tx.pan p{padding:.7rem 0 1.4rem}
.scene.hero{padding-top:30svh}
.scene.hero h2{font-size:clamp(2.6rem,12vw,6rem);font-style:italic;font-weight:400}
.hint{position:fixed;bottom:calc(3svh + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;z-index:25;font-family:"Caveat",cursive;
  font-size:1.3rem;color:var(--accent);transition:opacity .5s;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

.scene.on img[data-zoom]{pointer-events:auto;cursor:zoom-in}
.arch2{position:absolute;right:-24%;bottom:6%;z-index:1;width:46%;aspect-ratio:1;border:3px solid var(--bg);border-radius:50%}
.arch2 img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.4);background:var(--bg2)}
.arch2::after{content:"";position:absolute;inset:-7px;border:1px solid var(--accent);border-radius:50%;opacity:.65}
.sticker{position:absolute;left:6vw;top:4svh;width:min(28vw,15svh);rotate:-9deg;border:5px solid #fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:flo 6s ease-in-out infinite}
.decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;will-change:transform}
.decor>*{position:absolute;opacity:.45;animation:flo 7s ease-in-out infinite}
.decor .big{font-size:clamp(5rem,30vw,17rem);font-weight:600;letter-spacing:.04em;color:var(--accent);opacity:.08;animation:none}
.decor .lbl{font-family:"Caveat",cursive;font-size:1.5rem;color:var(--accent);opacity:.75;animation:none;white-space:nowrap}
.decor .still{animation:none;opacity:1}
.decor .board{left:50%;top:50%;width:min(80vmin,560px);aspect-ratio:1;translate:-50% -50%;rotate:14deg;opacity:.08;animation:none;border:2px solid var(--ink);background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/25% 25%}
.decor .sway{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.decor .thread{top:0;width:1.5px;height:24svh;background:#ff4d5a;opacity:.8;transform-origin:top;animation:swing 4s ease-in-out infinite}
.decor .thread b{position:absolute;bottom:-1.5rem;left:50%;translate:-50% 0;font-size:1.8rem;font-weight:400}
.decor .strip{top:-10%;width:26px;height:120%;opacity:.1;animation:none;background:repeating-linear-gradient(to bottom,transparent 0 12px,var(--ink) 12px 28px)}
.swap{display:grid}
.swap p.ttl{font-size:clamp(2.6rem,12vw,6rem);font-style:italic;line-height:1.05;font-variation-settings:"opsz" 144}
h2:empty{display:none}
.swap p{grid-area:1/1;margin:0;font-size:clamp(.98rem,3.3vw,1.2rem);line-height:1.55;will-change:transform,opacity}
.aud{display:flex;align-items:center;gap:.6rem;margin:.9rem auto 0;width:max-content;max-width:100%;padding:.3rem .9rem .3rem .35rem;border:1px solid var(--accent);border-radius:999px;background:color-mix(in srgb,var(--bg) 55%,transparent);font-size:.95rem;text-shadow:none}
.aud button{all:unset;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.8rem;cursor:pointer}
.aud i{display:block;width:min(28vw,110px);height:3px;border-radius:3px;background:color-mix(in srgb,var(--ink) 25%,transparent);position:relative;overflow:hidden}
.aud i b{position:absolute;inset:0;width:0;background:var(--accent)}
.scene.on .aud{pointer-events:auto}
@media (min-width:860px){.scene[data-side="r"] .aud{margin-left:0}.scene[data-side="l"] .aud{margin-right:0}}
@keyframes flo{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes sway{50%{transform:rotate(7deg)}}
@keyframes swing{50%{transform:rotate(6deg)}}
@media (min-width:860px){.sticker{left:auto;right:6vw;top:auto;bottom:9svh;width:min(16vw,230px)}}
#lb{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);cursor:zoom-out;padding:4vw}
#lb.show{display:flex;animation:fin .25s}
#lb img{max-width:92vw;max-height:80svh;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:zin .3s}
#lb p{margin:0;font-family:"Caveat",cursive;font-size:1.6rem;color:var(--accent)}
@keyframes fin{from{opacity:0}}
@keyframes zin{from{transform:scale(.9)}}
@media (min-width:860px){
  .scene{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:0;padding:0}
  .arch{justify-self:end;margin-right:7vw;width:min(26vw,58svh*.75,380px)}
  .words{justify-self:start;margin-left:7vw;padding-top:0;text-align:left}
  .scene[data-side="l"] .arch{grid-column:2;grid-row:1;justify-self:start;margin:0 0 0 7vw}
  .scene[data-side="l"] .words{grid-column:1;grid-row:1;justify-self:end;margin:0 7vw 0 0;text-align:right}
  .scene.hero{display:flex;flex-direction:column;justify-content:center;padding-top:22svh}
  .scene.hero .words{text-align:center;margin:0}
}

#finale{position:relative;z-index:5;min-height:100svh;padding:16svh 6vw 18svh;text-align:center;
  background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 70%,transparent) 22svh)}
#finale .words{margin:0 auto 5svh;text-align:center;padding:0}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.2s ease,transform 1.2s ease}
.rv.in{opacity:1;transform:none}
.vid{margin:0 auto;width:min(88vw,460px);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5);
  outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.vid video{display:block;width:100%;max-height:72svh;background:#000}
.vid .empty{display:grid;place-items:center;aspect-ratio:9/16;max-height:72svh;color:#fff9;font-family:"Caveat",cursive;font-size:1.5rem;padding:2rem}
#final-line{margin:6svh auto 0;font-size:clamp(1.6rem,6vw,2.6rem);font-style:italic;line-height:1.25;max-width:28rem}
#count{margin-top:3svh;font-family:"Caveat",cursive;font-size:1.6rem;color:var(--accent)}
@media (max-width:859px){
  .scene:not(.hero){display:grid;grid-template-rows:auto minmax(0,1fr);justify-items:center;align-content:start;gap:0;padding:10svh 5vw calc(2.5svh + env(safe-area-inset-bottom,0px))}
  .scene.hero{padding-top:30svh}
  .arch{width:auto;height:var(--ph,clamp(150px,30svh,280px));margin:0 0 .7rem;justify-self:center}
  .arch:has(figcaption:not(:empty)){margin-bottom:1.9rem}
  .arch figcaption{font-size:1.15rem;bottom:-1.7rem}
  .words{width:100%;max-width:30rem;max-height:100%;min-height:0;align-self:start;display:flex;flex-direction:column;padding:.8rem 1rem}
  h2{font-size:clamp(1.25rem,5.2vw,1.9rem);margin-bottom:.35rem}
  .tx{flex:1 1 auto;min-height:0}
  .tx p{font-size:clamp(.85rem,3.7vw,1.05rem);line-height:1.45}
  .sticker{left:4vw;top:2svh;width:min(22vw,11svh);border-width:4px}
  .decor>*{opacity:.28}
  .decor .lbl{display:none}
  .decor .still{opacity:.45}
  .aud{margin-top:.5rem;font-size:.85rem;flex:none}
}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.rv{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="sky"></canvas>
<div id="bar"></div>
<div class="hint" id="hint">role para baixo ↓</div>
<div id="lb"><img alt=""><p></p></div>
<div id="track"></div>
<section id="finale">
  <div class="words rv"><p class="date" id="f-eyebrow"></p><h2 id="f-title"></h2></div>
  <div class="vid rv" id="vid"></div>
  <p id="final-line" class="rv"></p>
  <p id="count" class="rv"></p>
</section>

const rnd = seed => () => (seed = seed * 16807 % 2147483647) / 2147483647;
function build(){
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  const sp = SH * .95, amp = W * (W < 860 ? .3 : .2);

  pts = [];
  const P = i => nodes[clamp(i, 0, N - 1)];
  for (let i = 0; i < N - 1; i++) for (let k = 0; k < S; k++){
    const t = k / S, a = P(i - 1), b = P(i), c = P(i + 1), d = P(i + 2);
    const cr = (p0, p1, p2, p3) => .5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
    pts.push({x: cr(a.x, b.x, c.x, d.x), y: cr(a.y, b.y, c.y, d.y)});
  }
  const L = nodes[N - 1]; sc = Math.min(SH * .021, W * .026);

    const t = Math.PI + k / HS * 2 * Math.PI;

}

    if (!s.tx) return;
    const tx = s.tx, p = tx.firstElementChild;
    tx.classList.remove("pan"); tx.style.maxHeight = "none"; p.style.fontSize = ""; p.style.transform = ""; s.el.style.removeProperty("--ph");
    const rest = s.words.offsetHeight - tx.offsetHeight, avail = Math.max(H * .8 - rest, 120);
    const room = () => mob ? tx.clientHeight : avail, over = () => p.offsetHeight > room() + 1;
    let fs = parseFloat(getComputedStyle(p).fontSize); const fMid = mob ? 13 : 15, fMin = mob ? 12 : 14;
    while (fs > fMid && over()){ fs -= .5; p.style.fontSize = fs + "px"; }
    if (mob && s.photo && over()){ let ph = s.photo.offsetHeight; while (ph > 120 && over()){ ph -= 10; s.el.style.setProperty("--ph", ph + "px"); } }
    while (fs > fMin && over()){ fs -= .5; p.style.fontSize = fs + "px"; }
    if (over()) tx.classList.add("pan");
    s.over = Math.max(0, p.offsetHeight - room());
    if (!mob) tx.style.maxHeight = avail + "px";
  });
}
fit(); if (document.fonts) document.fonts.ready.then(fit);

/* ---- ampliar imagem ao clicar ---- */
const lb = $("#lb"), lbi = lb.querySelector("img"), lbp = lb.querySelector("p");
const closeLb = () => { lb.classList.remove("show"); root.style.overflow = ""; };
document.addEventListener("click", e => {
  if (lb.classList.contains("show")) return closeLb();
  const t = e.target.closest("[data-zoom]");
  if (t){ lbi.src = t.currentSrc || t.src; lbp.textContent = t.alt || ""; lb.classList.add("show"); root.style.overflow = "hidden"; }
});
addEventListener("keydown", e => e.key === "Escape" && closeLb());

/* ---- loop ---- */
function frame(now){
  const y = scrollY, fr = y / (STEP * SH), f = fr - PRE, uMax = (pts.length - 1) / S, u = clamp(f - .5, 0, uMax);
  const th = themeAt(u);
  for (const k in th) root.style.setProperty("--" + k, rgb(th[k]));
  const ink = rgb(th.ink), acc = rgb(th.accent);

  // ponta do traço + câmera
  const fi = u * S, i = Math.min(Math.floor(fi), pts.length - 2), r = fi - i, A = pts[i], B = pts[i + 1];
  const tx = A.x + (B.x - A.x) * r, ty = A.y + (B.y - A.y) * r;
  const h = clamp((u - (N - 1)) / (uMax - (N - 1))), e = h * h * (3 - 2 * h);
  const wx = tx + (nodes[N - 1].x - tx) * e, wy = ty + (nodes[N - 1].y - 14.5 * sc - ty) * e;
  const ax = W / 2, ay = (W < 860 ? H * .05 : H * .5) * (1 - e) + H * .46 * e;
  if (first){ camX = wx; camY = wy; first = false; }
  camX += (wx - camX) * .14; camY += (wy - camY) * .14;
  const ox = ax - camX, oy = ay - camY;

  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
  // estrelas de fundo (parallax)
  cx.fillStyle = ink;
  for (const s of stars){
    cx.globalAlpha = .2 + .5 * Math.abs(Math.sin(now / 900 + s.ph));
    cx.fillRect(((s.x - camX * s.z) % W + W) % W, ((s.y - camY * s.z) % H + H) % H, s.r, s.r);
  }
  // rota futura, pontilhada
  cx.save(); cx.setLineDash([1, 9]); cx.lineCap = "round"; cx.lineWidth = 2; cx.globalAlpha = .2; cx.strokeStyle = ink; cx.beginPath();
  pts.forEach((p, k) => k ? cx.lineTo(p.x + ox, p.y + oy) : cx.moveTo(p.x + ox, p.y + oy)); cx.stroke(); cx.restore();

  // constelações satélites + estrelas dos momentos
  nodes.forEach((n, k) => {
    const nx = n.x + ox, ny = n.y + oy; if (Math.abs(ny - H / 2) > H * 1.2) return;
    const lit = clamp((u - (k - .3)) / .5), s = sats[k];
    cx.globalAlpha = lit * .4; cx.strokeStyle = cols[k * S] || acc; cx.lineWidth = 1; cx.beginPath();
    cx.moveTo(nx, ny); cx.lineTo(s[0].x + ox, s[0].y + oy); cx.lineTo(s[1].x + ox, s[1].y + oy);
    cx.moveTo(nx, ny); cx.lineTo(s[2].x + ox, s[2].y + oy); cx.lineTo(s[3].x + ox, s[3].y + oy); cx.stroke();
    cx.fillStyle = ink; s.forEach(p => { cx.globalAlpha = lit * .8; cx.beginPath(); cx.arc(p.x + ox, p.y + oy, p.r, 0, 6.28); cx.fill(); });
    if (lit < .05){ cx.globalAlpha = .35; cx.strokeStyle = ink; cx.beginPath(); cx.arc(nx, ny, 4, 0, 6.28); cx.stroke(); return; }
    const g = cx.createRadialGradient(nx, ny, 0, nx, ny, 34 * lit); g.addColorStop(0, "#fff"); g.addColorStop(.25, cols[k * S] || acc); g.addColorStop(1, "transparent");
    cx.globalAlpha = lit; cx.fillStyle = g; cx.beginPath(); cx.arc(nx, ny, 34 * lit, 0, 6.28); cx.fill();
    cx.strokeStyle = "#fff"; cx.lineWidth = 1.4; cx.globalAlpha = lit * .9; const q = 16 * lit;
    cx.beginPath(); cx.moveTo(nx - q, ny); cx.lineTo(nx + q, ny); cx.moveTo(nx, ny - q); cx.lineTo(nx, ny + q); cx.stroke();
  });

  // o traço contínuo, já desenhado (brilho + linha fina), cor muda com a história
  cx.lineCap = "round"; cx.globalAlpha = 1;
  for (const [w, al] of [[8, .13], [2, 1]]){
    cx.lineWidth = w; cx.globalAlpha = al;
    for (let k = 1; k <= i + 1; k++){
      const a = pts[k - 1], b = k === i + 1 ? {x: tx, y: ty} : pts[k];
      const x1 = a.x + ox, y1 = a.y + oy, x2 = b.x + ox, y2 = b.y + oy;
      if ((y1 < -40 && y2 < -40) || (y1 > H + 40 && y2 > H + 40) || (x1 < -40 && x2 < -40) || (x1 > W + 40 && x2 > W + 40)) continue;
      cx.strokeStyle = cols[k]; cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
    }
  }
  const px = tx + ox, py = ty + oy, g = cx.createRadialGradient(px, py, 0, px, py, 22);
  g.addColorStop(0, "#fff"); g.addColorStop(.3, acc); g.addColorStop(1, "transparent");
  cx.globalAlpha = 1; cx.fillStyle = g; cx.beginPath(); cx.arc(px, py, 22, 0, 6.28); cx.fill();

  // quando o vídeo chega, o mapa de estrelas esmaece para não competir com ele
  cv.style.opacity = .3 + .7 * clamp(($("#finale").getBoundingClientRect().top - H * .1) / (H * .5));

  // cenas (foto + texto)
  scenes.forEach((s, k) => {
    const d = f - (k + .5), c = clamp(d, -.7, .7);
    let o = clamp((.7 - Math.abs(d)) / .3); if (k === 0 && d < 0) o = 1;
    s.el.style.opacity = o; s.el.classList.toggle("on", o > .6);
    s.el.style.transform = `translateY(${c * -26}px)`;
    if (s.photo) s.photo.style.transform = `translateY(${c * -60}px) scale(${1 + (1 - o) * .07})`;
    if (s.words) s.words.style.transform = `translateY(${c * 36}px)`;
    if (s.decor) s.decor.style.transform = `translateY(${c * 70}px)`;
    if (s.tx && s.over > 1) s.tx.firstElementChild.style.transform = `translateY(${-s.over * clamp((d + .2) / .4)}px)`;
    if (s.swap.length > 1){ const q = (k === 0 ? clamp(fr / (PRE + .4)) : clamp((d + .5) / .8)) * (s.swap.length - 1);
      s.swap.forEach((p, j) => { p.style.opacity = clamp(2 - Math.abs(q - j) * 3.4); p.style.transform = `translateY(${(j - q) * 26}px)`; }); }
    if (s.audio && o < .15 && !s.audio.paused) s.audio.pause();
  });
  $("#bar").style.width = (y / (document.body.scrollHeight - H) * 100) + "%";
  $("#hint").style.opacity = y > H * .15 ? 0 : 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
